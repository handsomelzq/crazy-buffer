[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crazy-buffer"
version = "0.1.0"
description = "Explicit, validated spatial analysis building blocks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "pyogrio>=0.9,<1",
  "pandas>=2.2,<3",
]

[project.scripts]
crazy-buffer-gui = "crazy_buffer.gui.launcher:main"

[project.optional-dependencies]
network = ["networkx>=3.4,<4"]
gui = ["networkx>=3.4,<4", "streamlit>=1.66,<2", "pydeck>=0.9.1,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
